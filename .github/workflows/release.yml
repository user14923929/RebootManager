name: Release

# Runs ONLY when a version tag is pushed (v1.2.3, v1.2.3-rc1, ...). No branch or PR builds.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # gradle.properties pins org.gradle.java.home to a local path that does not exist on the runner,
      # which makes every Gradle invocation fail. Drop that line in CI only.
      - name: Remove local JDK path from gradle.properties
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - uses: gradle/actions/setup-gradle@v4

      # Safety net: generate the wrapper in an empty temp dir (the runner's preinstalled Gradle cannot
      # configure this project) if gradlew was not committed. Better: commit gradlew + gradle/wrapper/.
      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            echo "::warning::gradlew is not committed; generating it for this build."
            mkdir "$RUNNER_TEMP/wrapper"
            (cd "$RUNNER_TEMP/wrapper" && gradle wrapper --gradle-version 8.9)
            cp "$RUNNER_TEMP/wrapper/gradlew" "$RUNNER_TEMP/wrapper/gradlew.bat" .
            mkdir -p gradle/wrapper
            cp -r "$RUNNER_TEMP/wrapper/gradle/wrapper/." gradle/wrapper/
          fi

      - name: Build debug APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x gradlew
          ./gradlew assembleDebug \
            -PversionName="$VERSION" \
            -PversionCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/debug/app-debug.apk "RebootManager-$VERSION-debug.apk"
          echo "APK_FILE=RebootManager-$VERSION-debug.apk" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_FILE }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
