name: Release

# Runs ONLY when a version tag is pushed (v1.2.3, v1.2.3-rc1, ...). No branch or PR builds.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # gradle.properties points org.gradle.java.home at a local path; override it with the runner's JDK 17.
          gradle assembleDebug \
            -PversionName="$VERSION" \
            -PversionCode="$GITHUB_RUN_NUMBER" \
            -Dorg.gradle.java.home="$JAVA_HOME"
          cp app/build/outputs/apk/debug/app-debug.apk "RebootManager-$VERSION-debug.apk"
          echo "APK_FILE=RebootManager-$VERSION-debug.apk" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_FILE }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
